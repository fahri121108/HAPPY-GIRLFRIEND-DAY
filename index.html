<html style="margin:0;padding:0;">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<audio id="bgMusic" src="gril.mp3" loop preload="auto">
<script>
(function(){
  var s=document.createElement('style');
  s.textContent=`
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;font-family:'Quicksand',sans-serif;color:#fff;overflow:hidden;background:#050820}

    /* ===== BACKGROUND - TIDAK DIUBAH ===== */
    .bg{position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(1.5px 1.5px at 14% 20%,#fff 50%,transparent 51%),
        radial-gradient(1.2px 1.2px at 30% 44%,#fff 50%,transparent 51%),
        radial-gradient(1.8px 1.8px at 44% 9%,#fff 50%,transparent 51%),
        radial-gradient(1.4px 1.4px at 60% 30%,#fff 50%,transparent 51%),
        radial-gradient(1.6px 1.6px at 76% 16%,#fff 50%,transparent 51%),
        radial-gradient(1.3px 1.3px at 90% 38%,#fff 50%,transparent 51%),
        radial-gradient(1.5px 1.5px at 20% 64%,#fff 50%,transparent 51%),
        linear-gradient(180deg,#05092a 0%,#0b1455 40%,#182172 62%,#0c1240 100%)
    }
    .sq{position:absolute;border:2.5px solid rgba(255,255,255,.18);border-radius:16px;background:transparent;animation:float 14s ease-in-out infinite}
    .sq.a{width:84px;height:84px;top:7%;left:9%}
    .sq.b{width:126px;height:126px;top:4%;left:44%;border-radius:22px;border-width:3px;animation-delay:-3s}
    .sq.c{width:98px;height:98px;top:13%;right:7%;border-radius:18px;animation-delay:-6s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

    .road{position:fixed;bottom:-22%;left:-18%;width:72%;height:82%;
      transform:perspective(900px) rotateX(66deg);transform-origin:left bottom;
      background:repeating-linear-gradient(180deg,transparent 0 48px,#fff 48px 64px),#151a28;
      border-left:7px solid #fff;border-right:7px solid #fff;opacity:.62;z-index:1}
    .rail{position:fixed;bottom:0;left:-6%;width:78%;height:56%;z-index:2;pointer-events:none}

    /* ===== KARTU UTAMA - HANYA UKURAN DISESUAIKAN ===== */
    .wrap{position:relative;z-index:10;width:100%;height:100vh;
      display:flex;align-items:center;justify-content:center;padding:12px}
    .card{
      width:100%;max-width:410px;height:calc(100vh - 24px);max-height:780px;
      background:rgba(7,11,40,.9);
      border:3px solid #6cb0ff;border-radius:32px;
      box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 1.5px rgba(255,255,255,.07);
      backdrop-filter:blur(12px);
      padding:24px 20px 20px;position:relative;overflow:hidden
    }
    .cn{position:absolute;width:30px;height:30px;border:4px solid #6cb0ff;z-index:20}
    .cn.tl{top:15px;left:15px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
    .cn.tr{top:15px;right:15px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
    .cn.bl{bottom:15px;left:15px;border-right:0;border-top:0;border-radius:0 0 0 10px}
    .cn.br{bottom:15px;right:15px;border-left:0;border-top:0;border-radius:0 0 10px 0}

    /* ===== HALAMAN 0 PEMBUKA - PERSIS ASLI ===== */
    .opening{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
    .big-heart{font-size:90px;animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(255,90,140,.55))}
    @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.22)}50%{transform:scale(.94)}75%{transform:scale(1.14)}}
    .op-t1{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700;letter-spacing:.3px;
      background:linear-gradient(92deg,#ff86ad,#ffcd66,#72b0ff);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .op-t2{font-size:16px;color:#cfd6f2;font-weight:600;max-width:300px;line-height:1.6}
    .btn{
      margin-top:10px;padding:14px 34px;border-radius:999px;border:none;cursor:pointer;
      background:linear-gradient(135deg,#ff6b9d,#ff9a76);
      color:#fff;font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;letter-spacing:.4px;
      box-shadow:0 10px 28px rgba(255,107,157,.45);
      transition:transform .15s ease;
      animation:btnPulse 1.8s ease-in-out infinite
    }
    .btn:active{transform:scale(.94)}
    @keyframes btnPulse{0%,100%{box-shadow:0 10px 28px rgba(255,107,157,.45)}50%{box-shadow:0 14px 36px rgba(255,107,157,.7)}}

    /* ===== HALAMAN 1 GOSOK - PERSIS 100% ASLI ===== */
    .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .head .ico{background:rgba(255,255,255,.13);padding:4px 10px;border-radius:999px;font-size:15px}
    .head h3{font-family:'Fredoka',sans-serif;font-size:23px;font-weight:700;letter-spacing:.2px}
    .sub{font-size:15.5px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:7px;color:#eef2ff}

    .scr{position:relative;width:100%;aspect-ratio:16/10.3;border-radius:22px;overflow:hidden;
      border:3px solid #6cb0ff;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.35)}
    .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:14px;text-align:center}
    .under .t{font-family:'Fredoka',sans-serif;font-weight:700;color:#c43269;font-size:33px;line-height:1.1;text-shadow:2.5px 2.5px 0 #fff}
    .under .t2{margin-top:8px}
    .under .em{margin-top:12px;font-size:32px}
    canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}

    .btm{position:relative;margin-top:18px;height:32px}
    .btm .fl{position:absolute;left:-6px;top:-2px;font-size:26px}
    .btm .fr{position:absolute;right:-6px;top:-2px;font-size:26px}
    .btm .tx{text-align:center;padding-top:4px;font-size:15.5px;font-weight:700;color:#eef2ff}

    /* ===== HALAMAN 2 BERSIH - PERSIS 100% ASLI ===== */
    .done{text-align:center;margin-top:18px;font-size:16.5px;font-weight:700;color:#ffde6b}

    /* ===== HALAMAN 3 - TEKS DIPERBAIKI, TANPA ANIMASI ===== */
    .s3{height:100%;position:relative;display:flex;flex-direction:column}
    .mail{position:absolute;top:0;right:2px;font-size:26px;z-index:5}
    .ava{text-align:center;position:relative;margin-top:2px;margin-bottom:12px}
    .bub{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
      background:#fff;color:#333;font-size:13px;font-weight:700;
      padding:4px 11px 5px;border-radius:12px;border:1.5px solid #eee;white-space:nowrap;z-index:6}
    .bub::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
      border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #fff}
    .circle{width:100px;height:100px;border-radius:50%;background:#fff;margin:14px auto 0;overflow:hidden;
      border:3.5px solid #ff99b7;box-shadow:0 8px 22px rgba(255,143,177,.4);
      display:flex;align-items:center;justify-content:center;font-size:46px}
    .circle img{width:100%;height:100%;object-fit:cover}

    .date{display:flex;align-items:center;gap:7px;font-size:14px;color:#c8d0f0;margin:4px 0 6px;font-weight:600}
    .jt{font-family:'Fredoka',sans-serif;font-size:27px;font-weight:700;margin:4px 0 14px;line-height:1.25;
      background:linear-gradient(92deg,#ff85ac,#ffcc66,#70afff);
      -webkit-background-clip:text;background-clip:text;color:transparent}

    .pesan{
      flex:1;
      background:rgba(255,255,255,.055);
      border:1.5px solid rgba(255,255,255,.1);
      border-radius:18px;
      padding:14px 14px 2px;
      font-size:15px;line-height:1.8;color:#f0f3ff;font-weight:500;
      min-height:240px;
      overflow-y:auto;
      opacity:1 !important;
      transform:none !important;
      transition:none !important;
      animation:none !important;
    }
    .pesan::-webkit-scrollbar{width:4px}
    .pesan::-webkit-scrollbar-thumb{background:#6cb0ff88;border-radius:4px}
    .pesan p{margin:0 0 12px;text-align:left}

    #t{display:inline;opacity:1 !important;transition:none !important;animation:none !important}
    #t span{display:inline;opacity:1 !important;animation:none !important;transition:none !important}

    .cur{
      display:inline-block;width:2.5px;height:17px;
      background:#fff;vertical-align:middle;margin-left:2px;
      animation:bl 1s steps(2) infinite;
      opacity:1 !important;
    }
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}

    .sig{text-align:center;margin-top:12px;color:#b5bee3;font-size:12px;font-weight:600}
    .hah{display:inline-block;animation:beat 1.2s infinite}

    /* ===== PINDAH HALAMAN ===== */
    .st{position:absolute;inset:24px 20px 20px;transition:opacity .4s ease, transform .4s ease}
    .st.hid{opacity:0;transform:scale(.92);pointer-events:none;visibility:hidden}
    .pop{animation:pop .55s cubic-bezier(.18,1.55,.4,1) both}
    @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
    .p3-instant{animation:none !important;opacity:1 !important;transform:none !important}

    .fadeUp{animation:fadeUp .6s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .sp{position:absolute;pointer-events:none;font-size:20px;animation:spk 1.25s ease-out forwards;z-index:30}
    @keyframes spk{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
  `;
  document.head.appendChild(s);
})();
</script>

<!-- BACKGROUND -->
<div class="bg">
  <div class="sq a"></div><div class="sq b"></div><div class="sq c"></div>
</div>
<div class="road"></div>
<div class="rail">
  <svg viewBox="0 0 500 260" fill="none" preserveAspectRatio="none">
    <path d="M0 250 Q 180 190 500 70" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <line x1="8" y1="248" x2="8" y2="228"/><line x1="50" y1="238" x2="50" y2="218"/>
      <line x1="95" y1="226" x2="95" y2="204"/><line x1="145" y1="212" x2="145" y2="188"/>
      <line x1="200" y1="196" x2="200" y2="170"/><line x1="260" y1="178" x2="260" y2="150"/>
      <line x1="325" y1="158" x2="325" y2="128"/><line x1="395" y1="136" x2="395" y2="104"/>
      <line x1="470" y1="110" x2="470" y2="76"/>
    </g>
  </svg>
</div>

<!-- KARTU UTAMA -->
<div class="wrap">
  <div class="card pop">
    <span class="cn tl"></span><span class="cn tr"></span>
    <span class="cn bl"></span><span class="cn br"></span>

    <!-- HALAMAN 0: PEMBUKA - PERSIS ASLI -->
    <div id="p0" class="st">
      <div class="opening">
        <div class="big-heart">💖</div>
        <div class="op-t1 fadeUp">Ada Sesuatu Nih... 🥰</div>
        <div class="op-t2 fadeUp" style="animation-delay:.15s">
          Ada pesan kecil yang aku buat khusus buat kamu.
          <br>Pencet tombol di bawah ya 💌
        </div>
        <button class="btn fadeUp" style="animation-delay:.3s" onclick="mulai()">
          Buka Pesan Nya 🫶
        </button>
      </div>
    </div>

    <!-- HALAMAN 1: GOSOK - PERSIS 100% ASLI -->
    <div id="p1" class="st hid">
      <div class="head">
        <span class="ico">🧧</span>
        <h3>Coba Gosok Kartunya</h3>
      </div>
      <div class="sub">☀️ <span>Ada pesan spesial di baliknya! 🤫 💖</span></div>
      <div class="scr" id="sw">
        <div class="under">
          <div class="t">Happy National</div>
          <div class="t t2">Girlfriend Day!</div>
          <div class="em">💗🤗</div>

      </div>
      <div class="btm">
        <span class="fl">🌸</span>

      </div>
    </div>

    <!-- HALAMAN 2: BERSIH - PERSIS 100% ASLI + LAGU MULAI -->
    <div id="p2" class="st hid">
      <div class="head">
        <span class="ico">🧧</span>
        <h3>Coba Gosok Kartunya</h3>
      </div>
      <div class="sub">☀️ <span>Ada pesan spesial di baliknya! 🤫 💖</span></div>
      <div class="scr" style="border-color:#ff99b7">
        <div class="under">
          <div class="t">Happy National</div>
          <div class="t t2">Girlfriend Day!</div>
          <div class="em">💗🤗</div>
        </div>
      </div>
      <div class="done">Yeayy udah bersih! 🥳 ✨</div>
    </div>

    <!-- HALAMAN 3: HANYA TEKS DIPERBAIKI -->
    <div id="p3" class="st hid">
      <div class="s3">
        <span class="mail">💌</span>
        <div class="ava">
          <div class="bub">辛苦了~</div>
          <div class="circle">
            <img src="poto.jpg" alt="foto" onerror="this.style.display='none';this.parentElement.innerHTML='🐱🐱'">
          </div>
        </div>
        <div class="date">❤️ <span>Sabtu, 1 Agustus</span></div>
        <h1 class="jt">Happy Girlfriend Day! 🥳💖🎉</h1>
        <div class="pesan">
          <p id="t"></p><span class="cur" id="c"></span>
        </div>
        <div class="sig">— dibuat dengan sepenuh <span class="hah">❤️</span> —</div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  'use strict';
  var musicStarted = false;

  function goto(from,to,opts){
    opts=opts||{};
    document.getElementById(from).classList.add('hid');
    var el=document.getElementById(to);
    el.classList.remove('hid');
    if(!opts.noPop) el.classList.add('pop');
    return el;
  }

  function startMusic(){
    if(musicStarted) return;
    var audio = document.getElementById('bgMusic');
    audio.volume = 0.7;
    audio.play().then(()=>{ musicStarted = true; }).catch(e=>console.log('Audio blocked:',e));
  }

  window.mulai=function(){
    goto('p0','p1');
    setTimeout(initScratch, 350);
    loveBurst(document.querySelector('.btn'));
  };

  // ============== SCRATCH CARD - PERSIS ASLI ==============
  var cv,sw,ctx,go=false,done=false;
  function initScratch(){
    cv=document.getElementById('cv');sw=document.getElementById('sw');if(!cv)return;
    var r=sw.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    var W=r.width,H=r.height;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
    ctx=cv.getContext('2d');ctx.scale(dpr,dpr);

    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#a6c9ff');g.addColorStop(.5,'#cfb8ff');g.addColorStop(1,'#ffb9d3');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.save();ctx.globalAlpha=.28;ctx.strokeStyle='#fff';ctx.lineWidth=7;
    for(var i=-H;i<W*2;i+=34){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-H,H);ctx.stroke();}
    ctx.restore();

    var D=[['💖',.14,.20,24],['⭐',.34,.11,20],['✨',.70,.17,22],
           ['💗',.82,.36,24],['⭐',.17,.55,18],['✨',.55,.64,20],
           ['💖',.30,.78,22],['⭐',.78,.72,20],['🌙',.22,.31,28]];
    ctx.textAlign='center';ctx.textBaseline='middle';
    D.forEach(function(d){ctx.font=d[3]+'px serif';ctx.fillText(d[0],d[1]*W,d[2]*H)});

    ctx.fillStyle='#fff';ctx.font='bold 26px Fredoka, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
    ctx.fillText('✨ Gosok Disini ✨',W/2,H/2);ctx.shadowBlur=0;

    cv.addEventListener('mousedown',dn);cv.addEventListener('mousemove',mv);
    addEventListener('mouseup',up);
    cv.addEventListener('touchstart',dn,{passive:false});
    cv.addEventListener('touchmove',mv,{passive:false});
    addEventListener('touchend',up);
  }
  function ps(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
  function sc(x,y){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,26,0,Math.PI*2);ctx.fill();ctx.lineWidth=52;ctx.lineCap='round'}
  function dn(e){e.preventDefault();go=true;var t=ps(e);sc(t.x,t.y);ctx.beginPath();ctx.moveTo(t.x,t.y)}
  function mv(e){if(!go)return;e.preventDefault();var t=ps(e);ctx.lineTo(t.x,t.y);ctx.stroke();sc(t.x,t.y)}
  function up(){if(!go)return;go=false;cek()}

  function cek(){
    if(done)return;
    var d=ctx.getImageData(0,0,cv.width,cv.height).data,c=0;
    for(var i=3;i<d.length;i+=4)if(d[i]===0)c++;
    if(c/(d.length/4)>.68){
      done=true;
      cv.style.transition='opacity .45s ease';cv.style.opacity=0;
      sparkle(sw);
      setTimeout(function(){
        goto('p1','p2');
        startMusic(); // 🎵 Lagu mulai di halaman 2
        sparkle(document.querySelector('#p2 .scr'),26);
        setTimeout(function(){
          var p3 = document.getElementById('p3');
          var p2 = document.getElementById('p2');
          p2.classList.add('hid');
          p3.classList.remove('hid');
          p3.classList.remove('pop');
          p3.classList.add('p3-instant');
          setTimeout(ketik, 0); // LANGSUNG KETIK, 0ms JEDA
        }, 1900); // DURASI 1,9 DETIK PERSIS
      },500);
    }
  }

  // ============== SPARKLE & LOVE - PERSIS ASLI ==============
  function sparkle(el,n){
    n=n||22;var ic=['✨','⭐','💖','💫','🌟'];
    for(var i=0;i<n;i++){
      var s=document.createElement('span');s.className='sp';s.textContent=ic[(Math.random()*ic.length)|0];
      var a=Math.random()*Math.PI*2,ds=80+Math.random()*120;
      s.style.setProperty('--dx',Math.cos(a)*ds+'px');s.style.setProperty('--dy',Math.sin(a)*ds+'px');
      s.style.left='50%';s.style.top='50%';
      el.appendChild(s);setTimeout(function(x){x.remove()},1400,s);
    }
  }
  function loveBurst(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),ic=['💖','💗','💕','💘','✨'];
    for(var i=0;i<14;i++){
      var s=document.createElement('span');s.className='sp';s.textContent=ic[(Math.random()*ic.length)|0];
      s.style.position='fixed';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.zIndex=999;
      var a=Math.random()*Math.PI*2,ds=60+Math.random()*90;
      s.style.setProperty('--dx',Math.cos(a)*ds+'px');s.style.setProperty('--dy',Math.sin(a)*ds+'px');
      document.body.appendChild(s);setTimeout(function(x){x.remove()},1400,s);
    }
  }

  // ============== TEKS HALAMAN 3 - DIPERSINGKAT & LANCAR ==============
  var TEKS =
`Halo sayangku 🌷💖,

Selamat Hari Pacar Nasional ya! 🥳💖

Makasih sudah selalu ada, sabar, dan sayang sama aku. Maaf kalau aku masih banyak kurangnya. Aku janji terus berusaha jadi lebih baik buat kamu. 🤍

Kamu anugerah terindah buat aku. Senyum kamu bikin haraku cerah. 🥺🌸

Aku pengen kita terus bareng selamanya. Lewatin semuanya bersama-sama. 🫶

Aku sayang kamu selamanya! 💌❤️`;

  var elT, idx=0, SPD=65;

  function ketik(){
    elT=document.getElementById('t');
    if(!elT) return;
    elT.innerHTML='';
    idx=0;
    nextChar();
  }

  function nextChar(){
    if(idx >= TEKS.length){
      document.getElementById('c').style.display='none';
      loveBurst(document.querySelector('.jt'));
      return;
    }
    var ch = TEKS[idx++];
    if(ch === '\n'){
      elT.innerHTML += '<br>';
    } else {
      elT.innerHTML += ch;
    }
    var ps = document.querySelector('.pesan');
    if(ps) ps.scrollTop = ps.scrollHeight;

    var delay = SPD;
    var p = TEKS[idx-1];
    if(p === '.' || p === '!' || p === '?') delay = SPD * 6;
    else if(p === ',') delay = SPD * 2.4;
    else if(p === '\n') delay = SPD * 3.5;
    else if(p === '—') delay = SPD * 3;

    setTimeout(nextChar, delay);
  }

  // Klik muncul hati - PERSIS ASLI
  document.addEventListener('click',function(e){
    if(e.target.closest('button')||e.target.closest('canvas'))return;
    var s=document.createElement('span');s.className='sp';s.textContent=['💖','💕','✨','💗'][(Math.random()*4)|0];
    s.style.position='fixed';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.zIndex=999;
    var a=Math.random()*Math.PI*2,ds=40+Math.random()*60;
    s.style.setProperty('--dx',Math.cos(a)*ds+'px');s.style.setProperty('--dy',Math.sin(a)*ds-40+'px');
    document.body.appendChild(s);setTimeout(function(x){x.remove()},1300,s);
  });
