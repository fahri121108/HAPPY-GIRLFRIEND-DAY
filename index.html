<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💖</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%;
  width:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* TULISAN PETUNJUK ATAS (SEPERTI DI VIDEO) */
.hint {
  position:fixed;
  top:30px; left:0; right:0;
  text-align:center;
  font-size:16px;
  color:#ddd;
  z-index:10;
  letter-spacing:.3px;
  animation: naikTurun 1s infinite alternate;
}
@keyframes naikTurun {
  from { transform: translateY(0); opacity:.7; }
  to   { transform: translateY(-6px); opacity:1; }
}

/* KARTU TENGAH — PERSIS UKURAN DI VIDEO */
.card {
  position:absolute;
  left:50%; top:50%;
  transform: translate(-50%, -50%);
  width: 86%;
  max-width: 350px;
  aspect-ratio: 3 / 4;
  border-radius: 20px;
  background:#000;
  overflow:hidden;
}

/* ISI KARTU: FOTO + TEKS (SEMBUNYI AWALNYA) */
.inner {
  position:absolute; inset:0;
  display:flex;
  flex-direction:column;
  padding: 14px;
  opacity:0;
  transition: opacity .35s ease;
}
.card.buka .inner { opacity:1; }

/* FOTO DI ATAS */
.foto {
  width:100%;
  height: 60%;
  object-fit: cover;
  border-radius: 14px;
  background:#111;
  transform: translateY(30px);
  opacity:0;
  transition: all .6s cubic-bezier(.2,.7,.2,1);
}
.card.buka .foto {
  transform: translateY(0);
  opacity:1;
  transition-delay: .15s;
}

/* TEKS DI BAWAH FOTO — KELUAR SATU PER SATU */
.teks {
  margin-top: 14px;
  padding: 0 4px;
  font-size: 17px;
  line-height: 1.6;
}
.teks p {
  opacity:0;
  transform: translateY(22px);
  transition: all .55s cubic-bezier(.2,.7,.2,1);
}
.card.buka .teks p:nth-child(1) { transition-delay: .45s;  opacity:1; transform:translateY(0); }
.card.buka .teks p:nth-child(2) { transition-delay: .70s;  opacity:1; transform:translateY(0); }
.card.buka .teks p:nth-child(3) { transition-delay: .95s;  opacity:1; transform:translateY(0); }
.card.buka .teks p:nth-child(4) { transition-delay: 1.20s; opacity:1; transform:translateY(0); }

/* HASHTAG DI BAWAH */
.tag {
  margin-top: 10px;
  padding: 0 4px;
  font-size: 14px;
  color:#a4c2ff;
  opacity:0;
  transform: translateY(18px);
  transition: all .5s ease;
}
.card.buka .tag {
  transition-delay: 1.45s;
  opacity:1;
  transform: translateY(0);
}

/* LAPISAN PERAK GORESAN DI ATAS */
#scratch {
  position:absolute; inset:0;
  width:100%; height:100%;
  border-radius:20px;
  cursor: grab;
  z-index:5;
  touch-action: none;
}
.card.buka #scratch {
  opacity:0;
  transition: opacity .5s ease;
  pointer-events:none;
}
</style>
</head>
<body>

<!-- PETUNJUK AWAL -->
<div class="hint">🫵 GOSOK KARTU DI TENGAH</div>

<!-- KARTU UTAMA -->
<div class="card" id="card">

  <!-- ISI: FOTO + TEKS (MUNCUL SETELAH DIGOSOK) -->
  <div class="inner">
    <img src="poto.jpg" class="foto" alt="" onerror="this.style.background='#1a1a1a'">
    <div class="teks">
      <p>Untuk orang yang paling aku sayang 🫵❤️</p>
      <p>Terima kasih sudah ada di hidupku</p>
      <p>Kamu alasan aku senyum setiap hari</p>
      <p><strong>Aku sayang kamu selamanya 💕</strong></p>
    </div>
    <div class="tag">#untukkamu · #sayangkamu · #cintakita</div>
  </div>

  <!-- LAPISAN PERAK YANG DIGOSOK -->
  <canvas id="scratch"></canvas>
</div>

<script>
const canvas = document.getElementById('scratch');
const ctx    = canvas.getContext('2d');
const card   = document.getElementById('card');
let gambar   = false;
let sudah    = false;
let terakhir = {x:0, y:0};

// ===== ATUR UKURAN CANVAS =====
function ukur(){
  const r = canvas.getBoundingClientRect();
  canvas.width  = r.width  * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  catPerak();
}

// ===== CAT PERAK SEPERTI KARTU ASLI =====
function catPerak(){
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  // Gradasi perak metalik
  const grd = ctx.createLinearGradient(0,0,w,h);
  grd.addColorStop(0,   '#a8a8a8');
  grd.addColorStop(.25, '#eaeaea');
  grd.addColorStop(.5,  '#ffffff');
  grd.addColorStop(.75, '#dcdcdc');
  grd.addColorStop(1,   '#909090');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,w,h);

  // Garis-garis halus emas
  ctx.globalAlpha = .3;
  for(let i=-h; i<w; i+=7){
    ctx.strokeStyle = (i/7|0) % 2 === 0 ? '#d4af37' : '#777';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + h, h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Tulisan ditengah
  ctx.fillStyle = '#6b4a00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 24px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.fillText('✨ GOSOK SINI ✨', w/2, h/2 - 14);
  ctx.font = '15px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('gosok pelan-pelan ya 🥰', w/2, h/2 + 18);
}

// ===== HAPUS GORESAN =====
function hapus(x,y){
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';
  ctx.lineWidth = 46;
  ctx.beginPath();
  ctx.moveTo(terakhir.x, terakhir.y);
  ctx.lineTo(x,y);
  ctx.stroke();
  terakhir.x = x; terakhir.y = y;
}

// ===== AMBIL POSISI JARI / MOUSE =====
function pos(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

// ===== EVENT GORES =====
function mulai(e){
  e.preventDefault();
  gambar = true;
  const p = pos(e);
  terakhir = p;
  // titik awal
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(p.x, p.y, 23, 0, Math.PI*2);
  ctx.fill();
}
function gerak(e){
  e.preventDefault();
  if(!gambar) return;
  const p = pos(e);
  hapus(p.x, p.y);
  cekBuka();
}
function selesai(){
  gambar = false;
  cekBuka();
}

canvas.addEventListener('touchstart', mulai, {passive:false});
canvas.addEventListener('touchmove',  gerak, {passive:false});
canvas.addEventListener('touchend',   selesai);
canvas.addEventListener('mousedown',  mulai);
canvas.addEventListener('mousemove',  gerak);
window.addEventListener('mouseup',    selesai);

// ===== JIKA >60% TERGOSOK → BUKA PENUH OTOMATIS =====
function cekBuka(){
  if(sudah) return;
  const px = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let kosong = 0, total = 0;
  for(let i=3; i<px.length; i += 4*25){
    total++;
    if(px[i] === 0) kosong++;
  }
  if(kosong / total >= 0.60) bukaPenuh();
}

// ===== BUKA SEMUA + CONFETTI =====
function bukaPenuh(){
  sudah = true;
  card.classList.add('buka');
  document.querySelector('.hint').style.opacity = '0';

  // Confetti meledak pelan
  const akhir = Date.now() + 2000;
  (function conf(){
    confetti({ particleCount:5, angle:65,  spread:70, origin:{x:0},   colors:['#ff4d6d','#ffd166','#fff','#c77dff'] });
    confetti({ particleCount:5, angle:115, spread:70, origin:{x:1},   colors:['#ff4d6d','#ffd166','#fff','#c77dff'] });
    if(Date.now() < akhir) requestAnimationFrame(conf);
  })();
  setTimeout(()=>{
    confetti({ particleCount:130, spread:100, origin:{y:.55}, colors:['#ff4d6d','#ffd166','#fff','#c77dff','#4cc9f0'] });
  }, 300);
}

window.addEventListener('resize', ukur);
window.addEventListener('load', ukur);
setTimeout(ukur, 60);
</script>

</body>
</html>
