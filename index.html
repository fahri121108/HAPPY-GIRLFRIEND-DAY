<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff4d8d,#ff6cae,#ff9ecf);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

canvas#bg{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:-1;
}

.container{
width:360px;
max-width:92%;
text-align:center;
position:relative;
}

h1{
color:#fff;
font-size:34px;
font-weight:700;
text-shadow:0 0 18px rgba(255,255,255,.8);
margin-bottom:18px;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.05);
}
}

.card{
position:relative;
width:100%;
border-radius:24px;
overflow:hidden;
background:#fff;
box-shadow:
0 10px 40px rgba(0,0,0,.25),
0 0 35px rgba(255,255,255,.4);
}

.card img{
display:block;
width:100%;
pointer-events:none;
user-select:none;
}

#scratch{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
touch-action:none;
}

.progress{
margin-top:18px;
color:#fff;
font-size:18px;
font-weight:600;
letter-spacing:1px;
text-shadow:0 0 10px #fff;
}

.finish{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(.7);
padding:22px 34px;
background:white;
border-radius:22px;
font-size:28px;
font-weight:bold;
color:#ff3b87;
box-shadow:0 0 40px rgba(255,255,255,.8);
opacity:0;
pointer-events:none;
transition:.4s;
z-index:1000;
}

.finish.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

.heart{
position:fixed;
font-size:24px;
animation:float 5s linear forwards;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(0) scale(.6);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.4);
opacity:0;
}

}

.confetti{

position:fixed;

width:10px;

height:10px;

pointer-events:none;

animation:fall linear forwards;

}

@keyframes fall{

0%{

transform:translateY(-20px) rotate(0);

opacity:1;

}

100%{

transform:translateY(120vh) rotate(720deg);

opacity:0;

}

}

button{

margin-top:18px;

padding:12px 30px;

border:none;

border-radius:30px;

background:white;

color:#ff3b87;

font-size:16px;

font-weight:bold;

cursor:pointer;

display:none;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<h1>💖 HAPPY GIRLFRIEND DAY 💖</h1>

<div class="card">

<img src="poto.jpg" id="photo">

<canvas id="scratch"></canvas>

</div>

<div class="progress">
Terbuka :
<span id="percent">0%</span>
</div>

<button id="reset">
Main Lagi
</button>

</div>

<div class="finish" id="finish">
💖 HAPPY GIRLFRIEND DAY 💖
</div>

<script>

const bg=document.getElementById("bg");
const btx=bg.getContext("2d");

function resizeBG(){

bg.width=innerWidth;
bg.height=innerHeight;

}

resizeBG();

window.addEventListener("resize",resizeBG);

const particles=[];

for(let i=0;i<90;i++){

particles.push({

x:Math.random()*bg.width,

y:Math.random()*bg.height,

r:2+Math.random()*3,

dx:(Math.random()-.5)*0.4,

dy:(Math.random()-.5)*0.4

});

}

function animateBG(){

btx.clearRect(0,0,bg.width,bg.height);

for(let p of particles){

btx.beginPath();

btx.fillStyle="rgba(255,255,255,.8)";

btx.arc(p.x,p.y,p.r,0,Math.PI*2);

btx.fill();

p.x+=p.dx;

p.y+=p.dy;

if(p.x<0)p.x=bg.width;
if(p.x>bg.width)p.x=0;
if(p.y<0)p.y=bg.height;
if(p.y>bg.height)p.y=0;

}

requestAnimationFrame(animateBG);

}

animateBG();
const canvas=document.getElementById("scratch");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

const img=document.getElementById("photo");
const percent=document.getElementById("percent");
const finish=document.getElementById("finish");
const reset=document.getElementById("reset");

let drawing=false;
let completed=false;

function resizeScratch(){

canvas.width=img.clientWidth;
canvas.height=img.clientHeight;

ctx.globalCompositeOperation="source-over";

const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);

g.addColorStop(0,"#ff7fb8");
g.addColorStop(.5,"#ff4d8d");
g.addColorStop(1,"#ff2d75");

ctx.fillStyle=g;
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(255,255,255,.15)";

for(let i=0;i<200;i++){

ctx.beginPath();
ctx.arc(
Math.random()*canvas.width,
Math.random()*canvas.height,
Math.random()*2,
0,
Math.PI*2
);
ctx.fill();

}

ctx.fillStyle="#fff";
ctx.textAlign="center";

ctx.font="bold 42px Poppins";
ctx.fillText("HAPPY",canvas.width/2,canvas.height/2-55);

ctx.font="bold 34px Poppins";
ctx.fillText("GIRLFRIEND",canvas.width/2,canvas.height/2);

ctx.font="bold 42px Poppins";
ctx.fillText("DAY 💖",canvas.width/2,canvas.height/2+55);

ctx.globalCompositeOperation="destination-out";

}

img.onload=resizeScratch;
window.addEventListener("resize",resizeScratch);

function pos(e){

const r=canvas.getBoundingClientRect();

if(e.touches){

return{

x:e.touches[0].clientX-r.left,
y:e.touches[0].clientY-r.top

};

}

return{

x:e.clientX-r.left,
y:e.clientY-r.top

};

}

function sparkle(x,y){

const d=document.createElement("div");

d.className="heart";
d.innerHTML="✨";

d.style.left=(canvas.getBoundingClientRect().left+x)+"px";
d.style.top=(canvas.getBoundingClientRect().top+y)+"px";

d.style.fontSize=(10+Math.random()*18)+"px";

document.body.appendChild(d);

setTimeout(()=>{

d.remove();

},5000);

}

function erase(e){

if(!drawing||completed)return;

const p=pos(e);

ctx.beginPath();
ctx.arc(p.x,p.y,35,0,Math.PI*2);
ctx.fill();

sparkle(p.x,p.y);

checkPercent();

}

canvas.addEventListener("mousedown",()=>drawing=true);

canvas.addEventListener("mouseup",()=>drawing=false);

canvas.addEventListener("mouseleave",()=>drawing=false);

canvas.addEventListener("mousemove",erase);

canvas.addEventListener("touchstart",(e)=>{

drawing=true;
erase(e);

});

canvas.addEventListener("touchend",()=>drawing=false);

canvas.addEventListener("touchmove",(e)=>{

e.preventDefault();
erase(e);

},{passive:false});
function checkPercent(){

const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;

let clear=0;

for(let i=3;i<data.length;i+=4){

if(data[i]===0) clear++;

}

const total=canvas.width*canvas.height;

const value=Math.floor((clear/total)*100);

percent.innerText=value+"%";

if(value>=70 && !completed){

completed=true;

finish.classList.add("show");

reset.style.display="inline-block";

confetti(); 

heartRain();

}

}

function confetti(){

const colors=[
"#ff2d75",
"#ff6aa7",
"#ffffff",
"#ffd700",
"#7df9ff",
"#9b59ff"
];

for(let i=0;i<250;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.top="-20px";

c.style.background=
colors[Math.floor(Math.random()*colors.length)];

const s=6+Math.random()*8;

c.style.width=s+"px";
c.style.height=s+"px";

c.style.borderRadius=
Math.random()>.5?"50%":"2px";

c.style.animationDuration=
(2+Math.random()*2)+"s";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},4500);

}

}

function heartRain(){

const emoji=[
"💖",
"💕",
"💗",
"💞",
"❤️",
"✨"
];

let total=0;

const rain=setInterval(()=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML=
emoji[Math.floor(Math.random()*emoji.length)];

h.style.left=Math.random()*100+"vw";

h.style.bottom="-40px";

h.style.fontSize=
(18+Math.random()*24)+"px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},5000);

total++;

if(total>=80){

clearInterval(rain);

}

},120);

}

reset.onclick=()=>{

completed=false;

finish.classList.remove("show");

reset.style.display="none";

percent.innerText="0%";

resizeScratch();

};

resizeScratch();

</script>

</body>
</html>
