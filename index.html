<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08152d;
}

body{

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top,#143f74,#08152d 70%);

}

/*======================
STAR
======================*/

#stars{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;

}

.star{

position:absolute;
background:white;
border-radius:50%;
animation:blink 2.5s infinite;

}

@keyframes blink{

0%,100%{
opacity:.2;
}

50%{
opacity:1;
}

}

/*======================
LOVE
======================*/

.love{

position:fixed;
bottom:-30px;

animation:fly 10s linear forwards;

pointer-events:none;

}

@keyframes fly{

0%{

transform:translateY(0) scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.5);

opacity:0;

}

}

/*======================
PAGE
======================*/

.page{

position:absolute;

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

transition:1s;

}

/*======================
CARD
======================*/

.card{

width:92%;

max-width:430px;

background:#101114;

border:4px solid white;

border-radius:28px;

padding:25px;

box-shadow:

0 0 30px #59b3ff,

0 0 80px rgba(0,180,255,.3);

position:relative;

}

.card h2{

color:white;

text-align:center;

margin-bottom:8px;

font-size:28px;

}

.card p{

color:white;

text-align:center;

margin-bottom:20px;

font-size:18px;

}

/*======================
SCRATCH
======================*/

.scratch{

position:relative;

width:100%;

height:260px;

overflow:hidden;

border-radius:18px;

border:3px solid #8ecbff;

}

#hidden{

width:100%;

height:100%;

object-fit:cover;

position:absolute;

left:0;
top:0;

}

canvas{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

touch-action:none;

}

.info{

margin-top:20px;

color:white;

text-align:center;

font-size:18px;

}

/*======================
PAGE 2
======================*/

#page2{

display:none;

flex-direction:column;

}

.box{

width:92%;

max-width:430px;

background:#101114;

border:4px solid white;

border-radius:30px;

padding:35px;

box-shadow:

0 0 30px #59b3ff;

text-align:center;

position:relative;

}

.box h1{

font-size:42px;

color:white;

line-height:1.2;

opacity:0;

transform:scale(.8);

animation:zoomText 1s forwards;

}

.box h1 span{

display:block;

color:#ff9dbf;

}

@keyframes zoomText{

to{

opacity:1;

transform:scale(1);

}

}

.flower{

font-size:35px;

position:absolute;

animation:float 3s ease-in-out infinite;

}

.f1{

left:20px;
top:20px;

}

.f2{

right:20px;
top:20px;

}

.f3{

left:25px;
bottom:20px;

}

.f4{

right:25px;
bottom:20px;

}

@keyframes float{

50%{

transform:translateY(-10px);

}

}
/*======================
PAGE 3 (SURAT)
======================*/

#page3{

display:none;
justify-content:center;
align-items:center;
padding:20px;

}

.letter{

width:95%;
max-width:430px;
height:88vh;

background:#101114;

border:4px solid white;

border-radius:28px;

box-shadow:
0 0 35px #55b8ff;

padding:25px;

overflow:hidden;

position:relative;

}

.top{

display:flex;
align-items:center;
gap:15px;

}

.avatar{

width:65px;
height:65px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}

.name{

color:white;

font-size:20px;

font-weight:700;

}

.date{

color:#d8d8d8;

font-size:14px;

margin-top:4px;

}

#typing{

margin-top:25px;

color:white;

font-size:18px;

line-height:1.9;

white-space:pre-wrap;

}

.cursor{

display:inline-block;

width:3px;

height:24px;

background:white;

margin-left:5px;

animation:cursor .7s infinite;

}

@keyframes cursor{

50%{

opacity:0;

}

}

/*======================
BUTTON WA
======================*/

#reply{

display:none;

margin-top:25px;

width:100%;

padding:16px;

font-size:18px;

border:none;

border-radius:18px;

background:#25D366;

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

#reply:hover{

transform:scale(1.03);

}

.credit{

position:absolute;

bottom:15px;

left:0;

width:100%;

text-align:center;

color:#9fc7ff;

font-size:13px;

}

</style>

</head>

<body>

<div id="stars"></div>

<div id="page1" class="page">

<div class="card">

<h2>🎁 Coba Gosok Kartunya</h2>

<p>Gosok sampai habis ya ❤️</p>

<div class="scratch">

<img src="poto.jpg" id="hidden">

<canvas id="canvas"></canvas>

</div>

<div class="info">

✨ Ada hadiah spesial menunggumu ✨

</div>

</div>

</div>

<!-- =========================
PAGE 2
========================= -->

<div id="page2" class="page">

<div class="box">

<div class="flower f1">🌸</div>

<div class="flower f2">🌸</div>

<div class="flower f3">🌸</div>

<div class="flower f4">🌸</div>

<h1>

<span>Happy</span>

Girlfriend

Day! ❤️

</h1>

</div>

</div>

<!-- =========================
PAGE 3
========================= -->

<div id="page3" class="page">

<div class="letter">

<div class="top">

<img src="poto.jpg" class="avatar">

<div>

<div class="name">

Untuk Sayangku ❤️

</div>

<div class="date">

Happy Girlfriend Day

</div>

</div>

</div>

<div id="typing"></div>

<button id="reply">

💌 Balas Pesan

</button>

<div class="credit">

Made With ❤️ By Fahz Official

</div>

</div>

</div>

<script>
// =======================
// Bintang
// =======================

const stars = document.getElementById("stars");

for(let i=0;i<120;i++){

const s=document.createElement("div");

s.className="star";

const size=Math.random()*3+1;

s.style.width=size+"px";
s.style.height=size+"px";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*3+"s";

stars.appendChild(s);

}

// =======================
// Love
// =======================

setInterval(()=>{

const love=document.createElement("div");

love.className="love";

love.innerHTML=["❤️","💖","💕","🌸","✨"][Math.floor(Math.random()*5)];

love.style.left=Math.random()*100+"%";

love.style.fontSize=(20+Math.random()*15)+"px";

document.body.appendChild(love);

setTimeout(()=>{

love.remove();

},10000);

},700);

// =======================
// Scratch Card
// =======================

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

function resizeCanvas(){

canvas.width=canvas.offsetWidth;

canvas.height=canvas.offsetHeight;

ctx.globalCompositeOperation="source-over";

ctx.fillStyle="#6caeff";

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

ctx.font="bold 30px Poppins";

ctx.textAlign="center";

ctx.fillText("GOSOK DISINI",canvas.width/2,canvas.height/2);

ctx.globalCompositeOperation="destination-out";

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

let down=false;

function erase(x,y){

ctx.beginPath();

ctx.arc(x,y,28,0,Math.PI*2);

ctx.fill();

}

canvas.addEventListener("mousedown",()=>{

down=true;

});

canvas.addEventListener("mouseup",()=>{

down=false;

checkScratch();

});

canvas.addEventListener("mousemove",(e)=>{

if(!down)return;

const r=canvas.getBoundingClientRect();

erase(

e.clientX-r.left,

e.clientY-r.top

);

});

canvas.addEventListener("touchstart",(e)=>{

down=true;

const r=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-r.left,

t.clientY-r.top

);

});

canvas.addEventListener("touchmove",(e)=>{

e.preventDefault();

if(!down)return;

const r=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-r.left,

t.clientY-r.top

);

},{passive:false});

canvas.addEventListener("touchend",()=>{

down=false;

checkScratch();

});

function checkScratch(){

const img=ctx.getImageData(0,0,canvas.width,canvas.height);

let clear=0;

for(let i=3;i<img.data.length;i+=4){

if(img.data[i]==0){

clear++;

}

}

const percent=clear/(canvas.width*canvas.height);

if(percent>0.70){

canvas.style.display="none";

setTimeout(()=>{

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

setTimeout(()=>{

document.getElementById("page2").style.display="none";

document.getElementById("page3").style.display="flex";

startTyping();

},2500);

},300);

}

}
// ===============================
// Efek Mengetik Surat
// ===============================

const text = `Happy Girlfriend Day sayangku... ❤️

Hari ini aku cuma ingin mengingatkan satu hal.

Terima kasih karena sudah hadir di hidupku.

Terima kasih sudah menjadi seseorang yang selalu membuat hari-hariku lebih berwarna.

Mungkin aku belum sempurna.
Aku masih sering melakukan kesalahan.
Masih sering membuatmu kesal.
Masih sering membuatmu kecewa.

Tapi percayalah...
Tidak pernah ada niat sedikit pun untuk menyakitimu.

Aku selalu berusaha menjadi seseorang yang lebih baik.
Bukan karena terpaksa...
Melainkan karena aku ingin menjadi orang yang pantas untukmu.

Aku suka senyummu.
Aku suka tawamu.
Aku suka semua hal kecil tentangmu.

Semoga kita selalu diberi kebahagiaan.
Semoga hubungan kita selalu dipenuhi rasa saling percaya.

Kalau suatu saat nanti kita sedang bertengkar...
Semoga kita tidak pernah lelah untuk saling memperbaiki.

Aku ingin terus membuat kenangan baru bersamamu.

Aku ingin melihatmu tersenyum setiap hari.

Dan...

Aku berharap suatu hari nanti kita bisa melihat kembali semua kenangan ini sambil tersenyum bersama.

Terima kasih sudah menjadi bagian terindah dalam hidupku.

I Love You More Than Yesterday,
But Less Than Tomorrow.

Happy Girlfriend Day ❤️`;

let i = 0;

const typing = document.getElementById("typing");

function startTyping(){

typing.innerHTML = "";

const cursor = document.createElement("span");
cursor.className = "cursor";

const timer = setInterval(()=>{

typing.innerHTML += text.charAt(i);

i++;

typing.appendChild(cursor);

if(i >= text.length){

clearInterval(timer);

document.getElementById("reply").style.display="block";

}

},40);

}

// ===============================
// Tombol Balas WhatsApp
// ===============================

document.getElementById("reply").onclick = ()=>{

const nomor = "083825783159"; // GANTI DENGAN NOMOR WA

const pesan = encodeURIComponent(
"Happy Girlfriend Day juga sayangkuu ❤️🥹"
);

window.open(
"https://wa.me/"+nomor+"?text="+pesan,
"_blank"
);

};

// ===============================
// Selesai
// ===============================

</script>

</body>
</html>
