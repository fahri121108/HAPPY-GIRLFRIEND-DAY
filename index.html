<html style="margin:0;padding:0;">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  var s=document.createElement('style');
  s.textContent=`
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;min-height:100vh;font-family:'Quicksand',sans-serif;color:#fff;overflow-x:hidden;
      background:
        radial-gradient(1.5px 1.5px at 14% 20%,#fff 50%,transparent 51%),
        radial-gradient(1.2px 1.2px at 30% 44%,#fff 50%,transparent 51%),
        radial-gradient(1.8px 1.8px at 44% 9%,#fff 50%,transparent 51%),
        radial-gradient(1.4px 1.4px at 60% 30%,#fff 50%,transparent 51%),
        linear-gradient(180deg,#0a1550 0%,#142080 50%,#0b1350 100%)
    }

    /* KARTU PENDEK PERSIS GAMBAR */
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px 14px}
    .card{
      width:100%;max-width:410px;height:auto;
      background:rgba(10,16,60,.82);
      border:3px solid #6cb0ff;border-radius:26px;
      box-shadow:0 18px 55px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.08);
      backdrop-filter:blur(14px);
      padding:18px 16px 16px;
      position:relative;overflow:hidden;
      display:block !important;
      visibility:visible !important;
      opacity:1 !important
    }
    .cn{position:absolute;width:24px;height:24px;border:3.5px solid #6cb0ff;z-index:20}
    .cn.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:7px 0 0 0}
    .cn.tr{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 7px 0 0}
    .cn.bl{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 7px}
    .cn.br{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 7px 0}

    /* TOMBOL LAGU */
    .music{position:absolute;top:12px;right:40px;z-index:30;
      width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
      background:rgba(255,255,255,.15);color:#fff;font-size:14px;
      display:flex;align-items:center;justify-content:center;
      border:1.5px solid rgba(255,255,255,.25)}
    .music.on{animation:putar 2.5s linear infinite}
    @keyframes putar{to{transform:rotate(360deg)}}

    /* HALAMAN 0: PEMBUKA - LANGSUNG TAMPIL */
    .opening{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:6px 2px}
    .big-heart{font-size:60px;animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 5px 14px rgba(255,90,140,.55))}
    @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.2)}50%{transform:scale(.95)}75%{transform:scale(1.12)}}
    .op-t1{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;
      background:linear-gradient(92deg,#ff86ad,#ffcd66,#72b0ff);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .op-t2{font-size:13.5px;color:#cfd6f2;font-weight:600;line-height:1.55}
    .btn{
      margin-top:2px;padding:10px 26px;border-radius:999px;border:none;cursor:pointer;
      background:linear-gradient(135deg,#ff6b9d,#ff9a76);
      color:#fff;font-family:'Fredoka',sans-serif;font-size:14.5px;font-weight:700;
      box-shadow:0 7px 20px rgba(255,107,157,.45);
      transition:transform .15s ease;animation:btnPulse 1.8s ease-in-out infinite
    }
    .btn:active{transform:scale(.94)}
    @keyframes btnPulse{0%,100%{box-shadow:0 7px 20px rgba(255,107,157,.45)}50%{box-shadow:0 10px 26px rgba(255,107,157,.65)}}

    /* HALAMAN 1: GOSOK */
    .head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
    .head .ico{background:rgba(255,255,255,.13);padding:2px 8px;border-radius:999px;font-size:13px}
    .head h3{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700}
    .sub{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:5px;color:#eef2ff}
    .scr{position:relative;width:100%;aspect-ratio:16/9.5;border-radius:16px;overflow:hidden;
      border:3px solid #6cb0ff;background:#fff;box-shadow:0 5px 16px rgba(0,0,0,.28)}
    .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:6px;text-align:center}
    .under .t{font-family:'Fredoka',sans-serif;font-weight:700;color:#c43269;font-size:24px;line-height:1.1}
    .under .em{margin-top:4px;font-size:22px}
    canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
    .btm{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;
      font-size:13px;font-weight:700;color:#eef2ff}

    /* HALAMAN 2: UCAPAN */
    .h2{text-align:center;padding:4px 2px 6px}
    .h2 .big{font-size:52px;margin-bottom:2px;animation:beat 1.2s infinite}
    .h2 h2{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px;
      background:linear-gradient(92deg,#ff85ac,#ffcc66,#70afff);
      -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
    .h2 p{font-size:13px;color:#d6ddff;font-weight:600;margin-bottom:8px}
    .done{color:#ffde6b;font-weight:700;font-size:13.5px;margin-bottom:8px}

    /* HALAMAN 3: PESAN */
    .s3{position:relative}
    .mail{position:absolute;top:0;right:0;font-size:20px;z-index:5}
    .ava{text-align:center;position:relative;margin-bottom:6px}
    .bub{position:absolute;top:-1px;left:50%;transform:translateX(-50%);
      background:#fff;color:#333;font-size:10.5px;font-weight:700;
      padding:2px 8px 3px;border-radius:9px;border:1.5px solid #eee;white-space:nowrap;z-index:6}
    .bub::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
      border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff}
    .circle{width:70px;height:70px;border-radius:50%;background:#fff;margin:10px auto 0;overflow:hidden;
      border:2.5px solid #ff99b7;box-shadow:0 5px 14px rgba(255,143,177,.4);
      display:flex;align-items:center;justify-content:center;font-size:32px}
    .date{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#c8d0f0;margin:1px 0 2px;font-weight:600}
    .jt{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;margin:1px 0 6px;line-height:1.2;
      background:linear-gradient(92deg,#ff85ac,#ffcc66,#70afff);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .pesan{
      background:rgba(255,255,255,.05);
      border:1.5px solid rgba(255,255,255,.1);
      border-radius:12px;
      padding:9px 9px 1px;
      font-size:12.5px;line-height:1.7;color:#f0f3ff;font-weight:500;
      min-height:140px;max-height:160px;overflow-y:auto
    }
    .pesan::-webkit-scrollbar{width:3px}
    .pesan::-webkit-scrollbar-thumb{background:#6cb0ff88;border-radius:3px}
    .pesan p{margin:0 0 8px}
    #t span{opacity:1 !important;animation:none !important}
    .cur{display:inline-block;width:2px;height:12px;background:#fff;vertical-align:middle;margin-left:1px;animation:bl 1s steps(2) infinite}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
    .sig{text-align:center;margin-top:6px;color:#b5bee3;font-size:10.5px;font-weight:600}
    .hah{display:inline-block;animation:beat 1.2s infinite}

    /* PINDAH HALAMAN - HALAMAN 0 TIDAK HIDDEN */
    .st{transition:opacity .3s ease, transform .3s ease}
    .st.hid{display:none !important}
    .pop{animation:pop .45s cubic-bezier(.18,1.55,.4,1) both}
    @keyframes pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
  `;
  document.head.appendChild(s);
})();
</script>

<!-- ✅ LAGU: TAG DITUTUP BENAR (INI PENYEBAB UTAMA HALAMAN HILANG!) -->
<audio id="lagu" loop preload="auto">
  <!-- Ganti link di bawah ini dengan link MP3 kamu sendiri -->
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_77af5f1f5c.mp3?filename=romantic-piano-124739.mp3" type="audio/mpeg">


<div class="wrap">
  <div class="card pop">
    <span class="cn tl"></span><span class="cn tr"></span>
    <span class="cn bl"></span><span class="cn br"></span>

    <!-- Tombol Musik -->
    <button id="mBtn" class="music" onclick="toggleMusic()">🔇</button>

    <!-- =========================================
         ✅ HALAMAN 0: PEMBUKA - TIDAK ADA CLASS HID
         = PASTI MUNCUL PERTAMA KALI
         ========================================= -->
    <div id="p0" class="st">
      <div class="opening">
        <div class="big-heart">💖</div>
        <div class="op-t1">Ada Sesuatu Nih... 🥰</div>
        <div class="op-t2">Ada pesan kecil yang aku buat khusus buat kamu 💌</div>
        <button class="btn" onclick="mulai()">Buka Pesan Nya 🫶</button>
      </div>
    </div>

    <!-- HALAMAN 1: GOSOK -->
    <div id="p1" class="st hid">
      <div class="head">
        <span class="ico">🧧</span>
        <h3>Coba Gosok Kartunya</h3>
      </div>
      <div class="sub">☀️ <span>Ada pesan spesial di baliknya! 🤫 💖</span></div>
      <div class="scr" id="sw">
        <div class="under">
          <div class="t">Happy National</div>
          <div class="t">Girlfriend Day!</div>
          <div class="em">💗🤗</div>
        </div>
        <canvas id="cv"></canvas>
      </div>
      <div class="btm">🌸 Gosok sampai tuntas yaa ✨ ⭐</div>
    </div>

    <!-- HALAMAN 2: UCAPAN -->
    <div id="p2" class="st hid">
      <div class="h2">
        <div class="big">🥳</div>
        <h2>Yeayy Berhasil!</h2>
        <p>Kamu berhasil buka pesan rahasia aku ✨</p>
        <div class="done">Happy National Girlfriend Day! 💖🎉</div>
        <button class="btn" onclick="bukaPesan()">Baca Pesan Aku 📩</button>
      </div>
    </div>

    <!-- HALAMAN 3: PESAN -->
    <div id="p3" class="st hid">
      <div class="s3">
        <span class="mail">💌</span>
        <div class="ava">
          <div class="bub">辛苦了~</div>
          <div class="circle">🐱🐱</div>
        </div>
        <div class="date">❤️ <span>Sabtu, 1 Agustus 2026</span></div>
        <h1 class="jt">Happy Girlfriend Day! 🥳💖</h1>
        <div class="pesan"><p id="t"></p><span class="cur" id="c"></span></div>
        <div class="sig">— buat kamu, dengan sepenuh <span class="hah">❤️</span> —</div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  'use strict';
  var _W=0,_H=0;
  var lagu = document.getElementById('lagu');
  var mBtn = document.getElementById('mBtn');
  lagu.volume = 0.6;

  // KONTROL LAGU
  window.toggleMusic = function(){
    if(lagu.paused){
      lagu.play().then(()=>{mBtn.textContent='🎵';mBtn.classList.add('on')}).catch(()=>{});
    } else {
      lagu.pause();mBtn.textContent='🔇';mBtn.classList.remove('on');
    }
  };
  function mainkanLagu(){
    if(lagu.paused) lagu.play().then(()=>{mBtn.textContent='🎵';mBtn.classList.add('on')}).catch(()=>{});
  }

  // PINDAH HALAMAN
  function goto(to){
    ['p0','p1','p2','p3'].forEach(function(id){
      document.getElementById(id).classList.add('hid');
    });
    var el=document.getElementById(to);
    el.classList.remove('hid');
    el.classList.add('pop');
  }

  window.mulai=function(){
    goto('p1');
    mainkanLagu();
    setTimeout(initScratch, 300);
  };

  window.bukaPesan=function(){
    goto('p3');
    mainkanLagu();
    setTimeout(ketik, 50);
  };

  // SCRATCH CARD
  var cv,sw,ctx,go=false,done=false;
  function initScratch(){
    cv=document.getElementById('cv');sw=document.getElementById('sw');if(!cv)return;
    var r=sw.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    _W=r.width;_H=r.height;
    cv.width=_W*dpr;cv.height=_H*dpr;cv.style.width=_W+'px';cv.style.height=_H+'px';
    ctx=cv.getContext('2d');ctx.scale(dpr,dpr);

    var g=ctx.createLinearGradient(0,0,_W,_H);
    g.addColorStop(0,'#a6c9ff');g.addColorStop(.5,'#cfb8ff');g.addColorStop(1,'#ffb9d3');
    ctx.fillStyle=g;ctx.fillRect(0,0,_W,_H);

    ctx.save();ctx.globalAlpha=.25;ctx.strokeStyle='#fff';ctx.lineWidth=5;
    for(var i=-_H;i<_W*2;i+=30){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-_H,_H);ctx.stroke();}
    ctx.restore();

    var D=[['💖',.14,.20,20],['⭐',.34,.11,16],['✨',.70,.17,18],
           ['💗',.82,.36,20],['⭐',.17,.55,14],['✨',.55,.64,16],
           ['💖',.30,.78,18],['⭐',.78,.72,16],['💫',.50,.40,18]];
    ctx.textAlign='center';ctx.textBaseline='middle';
    D.forEach(function(d){ctx.font=d[3]+'px serif';ctx.fillText(d[0],d[1]*_W,d[2]*_H)});

    ctx.fillStyle='#fff';ctx.font='bold 22px Fredoka, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=9;ctx.shadowOffsetY=2;
    ctx.fillText('✨ Gosok Disini ✨',_W/2,_H/2);ctx.shadowBlur=0;

    cv.addEventListener('mousedown',dn);cv.addEventListener('mousemove',mv);
    window.addEventListener('mouseup',up);
    cv.addEventListener('touchstart',dn,{passive:false});
    cv.addEventListener('touchmove',mv,{passive:false});
    window.addEventListener('touchend',up);
  }
  function ps(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
  function sc(x,y){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();ctx.lineWidth=44;ctx.lineCap='round'}
  function dn(e){e.preventDefault();go=true;var t=ps(e);sc(t.x,t.y);ctx.beginPath();ctx.moveTo(t.x,t.y)}
  function mv(e){if(!go)return;e.preventDefault();var t=ps(e);ctx.lineTo(t.x,t.y);ctx.stroke();sc(t.x,t.y)}
  function up(){if(!go)return;go=false;cek()}

  function cek(){
    if(done)return;
    var d=ctx.getImageData(0,0,cv.width,cv.height).data,c=0;
    for(var i=3;i<d.length;i+=4)if(d[i]===0)c++;
    if(c/(d.length/4)>.65){
      done=true;
      cv.style.transition='opacity .35s ease';cv.style.opacity=0;
      mainkanLagu();
      setTimeout(function(){goto('p2');},500);
    }
  }

  // KETIK PESAN
  var TEKS =
`Hai sayangku 🌷💖,

Selamat Hari Pacar Nasional ya! 🥳
Aku bersyukur banget kita masih bareng sampai hari ini. 🤍

Makasih ya udah sabar, baik, dan selalu ada buat aku—walau aku sering bikin kamu kesel dan masih banyak kurangnya. 😔

Maafin aku ya kalau belum jadi yang terbaik. Aku janji bakal terus belajar jadi orang yang lebih ngertiin kamu, lebih peka, dan bikin kamu selalu nyaman. 🌱

Kamu itu anugerah terindah di hidup aku. Senyum kamu itu obat paling ampuh buat hari-hari aku yang capek. 🥺🌸

Aku pengen kita terus bareng ya, lewatin semuanya sama-sama. Aku sayang kamu, lebih dari apa pun. 🫶💌

Selamat hari pacar ya cintaku! 💖🎉`;

  var elT, elC, idx=0, SPD=56;
  function ketik(){
    elT=document.getElementById('t');elC=document.getElementById('c');if(!elT)return;
    elT.innerHTML='';idx=0;nextChar();
  }
  function nextChar(){
    if(idx >= TEKS.length){elC.style.display='none';return}
    var ch = TEKS[idx++];
    if(ch === '\n') elT.innerHTML += '<br>';
    else {var sp=document.createElement('span');sp.textContent=ch;elT.appendChild(sp)}
    var ps=document.querySelector('.pesan');if(ps)ps.scrollTop=ps.scrollHeight;
    var d=SPD,p=TEKS[idx-1];
    if(p==='.'||p==='!'||p==='?')d=SPD*5;
    else if(p===',')d=SPD*2;
    else if(p==='\n')d=SPD*3;
    setTimeout(nextChar,d);
  }
})();
</script>
</html>
