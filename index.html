<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#081529;

}

body{

display:flex;
justify-content:center;
align-items:center;

background:

radial-gradient(circle at top,#17457c,#081529 75%);

}

/*========================
STAR
========================*/

#stars{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;

}

.star{

position:absolute;

background:white;

border-radius:50%;

animation:blink 3s infinite;

}

@keyframes blink{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

}

}

/*========================
LOVE
========================*/

#love{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

overflow:hidden;

}

.heart{

position:absolute;

bottom:-50px;

animation:heartFly 12s linear forwards;

}

@keyframes heartFly{

0%{

transform:translateY(0) scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.6);

opacity:0;

}

}

/*========================
PAGE
========================*/

.page{

position:absolute;

width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

transition:1s;

}

/*========================
CARD
========================*/

.card{

width:92%;

max-width:430px;

background:#101216;

border:4px solid white;

border-radius:28px;

padding:25px;

position:relative;

overflow:hidden;

box-shadow:

0 0 35px #5ab8ff,

0 0 80px rgba(0,180,255,.3);

}

.card h2{

text-align:center;

font-size:30px;

color:white;

margin-bottom:10px;

font-weight:800;

}

.card p{

text-align:center;

font-size:18px;

color:white;

margin-bottom:20px;

opacity:.9;

}

/*========================
SCRATCH
========================*/

.scratch{

position:relative;

width:100%;
height:260px;

border-radius:20px;

overflow:hidden;

border:3px solid #8cd0ff;

background:#111;

}

/* Yang akan terlihat setelah digosok */

#underCard{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:#111216;

}

/*========================
FLOWER
========================*/

.flower{

position:absolute;

font-size:34px;

animation:flowerMove 3s ease-in-out infinite;

}

.fl1{

left:18px;
top:18px;

}

.fl2{

right:18px;
top:18px;

}

.fl3{

left:18px;
bottom:18px;

}

.fl4{

right:18px;
bottom:18px;

}

@keyframes flowerMove{

50%{

transform:translateY(-10px);

}

}

.happy{

font-size:44px;

font-weight:800;

line-height:1.1;

text-align:center;

color:white;

text-shadow:

0 0 15px #ff9ad8,

0 0 25px #ff9ad8;

}

.happy small{

display:block;

font-size:24px;

margin-top:15px;

color:#ffd6ef;

}

canvas{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

touch-action:none;

}

.info{

margin-top:18px;

text-align:center;

font-size:18px;

color:white;

}
/*========================
HALAMAN SURAT
========================*/

#letterPage{

display:none;

justify-content:center;

align-items:center;

padding:20px;

background:
radial-gradient(circle at top,#183d72,#081529 80%);

}

.letterCard{

width:95%;

max-width:430px;

height:90vh;

background:#101216;

border:4px solid white;

border-radius:28px;

box-shadow:

0 0 30px #55baff,

0 0 70px rgba(0,170,255,.25);

overflow-y:auto;

overflow-x:hidden;

position:relative;

scroll-behavior:smooth;

padding:22px;

}

.letterCard::-webkit-scrollbar{

display:none;

}

.profile{

display:flex;

align-items:center;

gap:14px;

margin-bottom:18px;

}

.profile img{

width:68px;

height:68px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

box-shadow:0 0 15px #66bfff;

}

.profile h3{

color:white;

font-size:22px;

}

.profile span{

display:block;

color:#d5d5d5;

font-size:14px;

margin-top:4px;

}

#typing{

margin-top:18px;

color:white;

font-size:18px;

line-height:2;

white-space:pre-wrap;

word-break:break-word;

min-height:200px;

}

.cursor{

display:inline-block;

width:3px;

height:22px;

background:white;

margin-left:4px;

animation:cursor .7s infinite;

}

@keyframes cursor{

50%{

opacity:0;

}

}

.replyBtn{

display:none;

margin-top:28px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:#25D366;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.replyBtn:hover{

transform:scale(1.03);

}

.credit{

margin-top:18px;

text-align:center;

font-size:13px;

color:#93c9ff;

}

/*========================
TRANSISI
========================*/

.fadeOut{

animation:fadeOut .8s forwards;

}

.fadeIn{

animation:fadeIn .8s forwards;

}

@keyframes fadeOut{

to{

opacity:0;

transform:scale(.95);

}

}

@keyframes fadeIn{

from{

opacity:0;

transform:scale(1.05);

}

to{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<div id="stars"></div>

<div id="love"></div>

<!-- =======================
HALAMAN SCRATCH
======================= -->

<div id="scratchPage" class="page">

<div class="card">

<h2>🎁 Coba Gosok Kartunya</h2>

<p>Gosok perlahan sampai bersih ❤️</p>

<div class="scratch">

<div id="underCard">

<div class="flower fl1">🌸</div>

<div class="flower fl2">🌸</div>

<div class="flower fl3">🌸</div>

<div class="flower fl4">🌸</div>

<div class="happy">

Happy

<br>

Girlfriend

<br>

Day! ❤️

<small>

Untuk Seseorang Yang Sangat Spesial 💕

</small>

</div>

</div>

<canvas id="scratchCanvas"></canvas>

</div>

<div class="info">

✨ Gosok sampai habis ya ✨

</div>

</div>

</div>

<!-- =======================
HALAMAN SURAT
======================= -->

<div id="letterPage" class="page">

<div class="letterCard">

<div class="profile">

<img src="poto.jpg">

<div>

<h3>Happy Girlfriend Day ❤️</h3>

<span>1 Agustus 2026</span>

</div>

</div>

<div id="typing"></div>

<button class="replyBtn" id="replyBtn">

💌 Balas Pesan

</button>

<div class="credit">

Made With ❤️ By Fahz Official

</div>

</div>

</div>

<script>
// =========================
// MEMBUAT BINTANG
// =========================

const stars=document.getElementById("stars");

for(let i=0;i<130;i++){

const star=document.createElement("div");

star.className="star";

const s=Math.random()*3+1;

star.style.width=s+"px";
star.style.height=s+"px";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

stars.appendChild(star);

}

// =========================
// LOVE TERBANG
// =========================

const love=document.getElementById("love");

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=["❤️","💕","💖","🌸","✨"][Math.floor(Math.random()*5)];

heart.style.left=Math.random()*100+"%";

heart.style.fontSize=(18+Math.random()*18)+"px";

love.appendChild(heart);

setTimeout(()=>{

heart.remove();

},12000);

},700);

// =========================
// SCRATCH
// =========================

const canvas=document.getElementById("scratchCanvas");

const ctx=canvas.getContext("2d");

function setupScratch(){

canvas.width=canvas.offsetWidth;

canvas.height=canvas.offsetHeight;

ctx.globalCompositeOperation="source-over";

const grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);

grad.addColorStop(0,"#73bfff");
grad.addColorStop(1,"#5ca7ff");

ctx.fillStyle=grad;

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(255,255,255,.15)";

for(let i=0;i<80;i++){

ctx.fillRect(

Math.random()*canvas.width,

Math.random()*canvas.height,

160,

2

);

}

ctx.fillStyle="white";

ctx.font="bold 34px Poppins";

ctx.textAlign="center";

ctx.fillText(

"GOSOK DISINI",

canvas.width/2,

canvas.height/2

);

ctx.globalCompositeOperation="destination-out";

}

setupScratch();

window.addEventListener("resize",setupScratch);

let isDown=false;

function erase(x,y){

ctx.beginPath();

ctx.arc(x,y,30,0,Math.PI*2);

ctx.fill();

}

canvas.onmousedown=()=>{

isDown=true;

};

canvas.onmouseup=()=>{

isDown=false;

checkScratch();

};

canvas.onmouseleave=()=>{

isDown=false;

};

canvas.onmousemove=(e)=>{

if(!isDown)return;

const r=canvas.getBoundingClientRect();

erase(

e.clientX-r.left,

e.clientY-r.top

);

};

canvas.ontouchstart=(e)=>{

isDown=true;

const r=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-r.left,

t.clientY-r.top

);

};

canvas.ontouchmove=(e)=>{

e.preventDefault();

if(!isDown)return;

const r=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-r.left,

t.clientY-r.top

);

};
// =========================
// CEK SCRATCH SELESAI
// =========================

let finished=false;

function checkScratch(){

if(finished) return;

const pixels=ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

let clear=0;

for(let i=3;i<pixels.data.length;i+=4){

if(pixels.data[i]===0){

clear++;

}

}

const total=
canvas.width*canvas.height;

const percent=
clear/total;


if(percent>=0.75){

finished=true;


// hilangkan scratch perlahan

canvas.style.transition="1s";

canvas.style.opacity="0";


// tunggu agar hasil Happy Girlfriend Day terlihat

setTimeout(()=>{


canvas.style.display="none";


},1000);


// pindah ke surat

setTimeout(()=>{


document.getElementById("scratchPage")
.classList.add("fadeOut");


setTimeout(()=>{


document.getElementById("scratchPage")
.style.display="none";


document.getElementById("letterPage")
.style.display="flex";


document.getElementById("letterPage")
.classList.add("fadeIn");


// mulai mengetik

startTyping();


},800);


},3000);


}

}


// =========================
// TOUCH MOVE TAMBAHAN
// =========================


canvas.addEventListener(
"touchend",
()=>{

isDown=false;

checkScratch();

}
);

canvas.addEventListener(
"mousedown",
()=>{

isDown=true;

}
);

canvas.addEventListener(
"mousemove",
(e)=>{

if(!isDown)return;


const rect=
canvas.getBoundingClientRect();


erase(
e.clientX-rect.left,
e.clientY-rect.top
);


}
);
// =========================
// EFEK MENGETIK SURAT
// =========================

const isiSurat = `

Halo sayangku... ❤️


Happy Girlfriend Day untuk seseorang yang paling spesial dalam hidupku.


Terima kasih sudah hadir dan menjadi bagian dari cerita hidupku.

Terima kasih sudah selalu memberikan warna baru di hari-hariku.


Aku tahu aku bukan seseorang yang sempurna.

Aku masih memiliki banyak kekurangan.

Aku masih sering melakukan kesalahan.

Tetapi aku selalu ingin belajar menjadi lebih baik untuk kamu.


Terima kasih karena sudah sabar menghadapi sifatku.

Terima kasih karena selalu mencoba mengerti aku.

Terima kasih karena tetap bertahan sampai sekarang.


Aku bersyukur bisa mengenal kamu.

Dari banyaknya orang di dunia ini, aku dipertemukan dengan seseorang yang begitu berharga.


Aku suka caramu tersenyum.

Aku suka caramu bercerita.

Aku suka hal-hal kecil yang kamu lakukan.


Semoga kita selalu diberikan kebahagiaan.

Semoga hubungan kita selalu dipenuhi rasa percaya dan kasih sayang.


Kalau suatu hari nanti kita sedang menghadapi masalah,

semoga kita selalu ingat bahwa kita pernah memilih untuk saling bertahan.


Aku ingin terus membuat kenangan indah bersamamu.

Aku ingin melihat senyum kamu lebih banyak lagi.

Aku ingin selalu menjadi alasan kecil di balik kebahagiaanmu.


Terima kasih sudah menjadi kamu.

Jangan pernah lupa kalau kamu sangat berarti.


Happy Girlfriend Day sayangku ❤️


I Love You Forever 🤍

`;



let indexText=0;


const tempatTulis=
document.getElementById("typing");



function startTyping(){


tempatTulis.innerHTML="";


const cursor=
document.createElement("span");


cursor.className="cursor";


tempatTulis.appendChild(cursor);



const timer=setInterval(()=>{


if(indexText < isiSurat.length){


cursor.remove();


tempatTulis.innerHTML += 
isiSurat.charAt(indexText);


tempatTulis.appendChild(cursor);



indexText++;



// AUTO SCROLL

const box=
document.querySelector(".letterCard");


box.scrollTop =
box.scrollHeight;



}else{


clearInterval(timer);


cursor.remove();


document.getElementById("replyBtn")
.style.display="block";


}



},45);



}
// =========================
// TOMBOL BALAS WHATSAPP
// =========================

const replyBtn =
document.getElementById("replyBtn");


replyBtn.onclick=function(){


// GANTI DENGAN NOMOR WHATSAPP TUJUAN

const nomor="083825783159";


const pesan=
encodeURIComponent(
"Hai sayang ❤️\n\nTerima kasih untuk pesan indahnya 🥰"
);



window.open(

"https://wa.me/"+nomor+"?text="+pesan,

"_blank"

);


};



// =========================
// MUSIK
// =========================


const lagu=
new Audio("musik.mp3");


lagu.loop=true;



document.body.addEventListener(
"click",
()=>{


lagu.play()
.catch(()=>{});


},
{
once:true
}

);



// =========================
// LOVE TAMBAHAN
// =========================


setInterval(()=>{


const h=document.createElement("div");


h.className="heart";


h.innerHTML=
["❤️","💕","💖","✨"][

Math.floor(
Math.random()*4
)

];


h.style.left=
Math.random()*100+"%";


h.style.fontSize=
(18+Math.random()*25)+"px";


h.style.animationDuration=
(8+Math.random()*6)+"s";



document.getElementById("love")
.appendChild(h);



setTimeout(()=>{

h.remove();

},14000);



},1000);



// =========================
// SELESAI
// =========================
</script>

</body>

</html>
