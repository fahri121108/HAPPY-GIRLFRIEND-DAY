<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

background:#071327;

}

body{

display:flex;
justify-content:center;
align-items:center;

background:

radial-gradient(circle at top,#163f74,#071327 80%);

}

/*=========================
STAR
=========================*/

#stars{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;

}

.star{

position:absolute;

background:white;

border-radius:50%;

animation:twinkle 2.5s infinite;

}

@keyframes twinkle{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

}

}

/*=========================
LOVE
=========================*/

#love{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

}

.heart{

position:absolute;

bottom:-30px;

animation:fly 12s linear forwards;

}

@keyframes fly{

0%{

transform:translateY(0) scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.5);

opacity:0;

}

}

/*=========================
PAGE
=========================*/

.page{

position:absolute;

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

transition:1s;

}

/*=========================
CARD
=========================*/

.card{

width:92%;

max-width:430px;

background:#111318;

border:4px solid white;

border-radius:28px;

padding:25px;

box-shadow:

0 0 30px #54b3ff,

0 0 70px rgba(0,170,255,.3);

position:relative;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

width:250px;

height:250px;

background:rgba(255,255,255,.04);

border-radius:50%;

right:-120px;

top:-120px;

}

.card h2{

color:white;

text-align:center;

font-size:28px;

margin-bottom:10px;

font-weight:800;

}

.card p{

color:white;

text-align:center;

font-size:17px;

margin-bottom:20px;

opacity:.9;

}

.scratch{

position:relative;

width:100%;

height:260px;

border-radius:18px;

overflow:hidden;

border:3px solid #89cbff;

background:black;

}

#happy{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:#111318;

}

/*=========================
FLOWER
=========================*/

.flower{

font-size:34px;

position:absolute;

animation:float 3s ease-in-out infinite;

}

.fl1{

left:18px;
top:18px;

}

.fl2{

right:18px;
top:18px;

}

.fl3{

left:18px;
bottom:18px;

}

.fl4{

right:18px;
bottom:18px;

}

@keyframes float{

50%{

transform:translateY(-8px);

}

}

.big{

font-size:44px;

font-weight:800;

color:white;

line-height:1.1;

text-align:center;

text-shadow:0 0 20px #ff8bd5;

}

.small{

font-size:24px;

margin-top:15px;

color:#ffd5ec;

}

canvas{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

touch-action:none;

}

.info{

margin-top:20px;

text-align:center;

font-size:18px;

color:white;

}
/*=========================
PAGE 2
=========================*/

#page2{

display:none;

justify-content:center;
align-items:center;

}

.happyCard{

width:92%;
max-width:430px;

background:#111318;

border:4px solid white;

border-radius:28px;

padding:30px;

position:relative;

box-shadow:
0 0 35px #5cbcff,
0 0 80px rgba(0,180,255,.25);

overflow:hidden;

animation:showCard .8s ease;

}

@keyframes showCard{

from{

opacity:0;
transform:scale(.8);

}

to{

opacity:1;
transform:scale(1);

}

}

.happyCard h1{

font-size:48px;

line-height:1.1;

text-align:center;

font-weight:800;

color:white;

text-shadow:0 0 25px #ff89cf;

animation:pulse 2s infinite;

}

.happyCard h1 span{

display:block;

color:#ffc6e4;

}

@keyframes pulse{

50%{

transform:scale(1.05);

}

}

.glow{

position:absolute;

width:180px;
height:180px;

background:#4cb9ff44;

filter:blur(70px);

border-radius:50%;

}

.g1{

left:-80px;
top:-80px;

}

.g2{

right:-80px;
bottom:-80px;

}

/*=========================
PAGE 3
=========================*/

#page3{

display:none;

justify-content:center;
align-items:center;

padding:18px;

}

.letter{

width:100%;
max-width:430px;

height:90vh;

background:#111318;

border:4px solid white;

border-radius:28px;

overflow-y:auto;

padding:22px;

box-shadow:
0 0 35px #55baff;

scroll-behavior:smooth;

}

.letter::-webkit-scrollbar{

display:none;

}

.profile{

display:flex;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.profile img{

width:70px;

height:70px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}

.profile h3{

color:white;

font-size:21px;

}

.profile small{

color:#cccccc;

}

#typing{

color:white;

font-size:18px;

line-height:2;

white-space:pre-wrap;

word-break:break-word;

}

.cursor{

display:inline-block;

width:3px;

height:22px;

background:white;

animation:cursor .7s infinite;

margin-left:5px;

}

@keyframes cursor{

50%{

opacity:0;

}

}

.reply{

margin-top:30px;

width:100%;

padding:15px;

border:none;

border-radius:18px;

background:#25D366;

font-size:18px;

font-weight:bold;

color:white;

display:none;

cursor:pointer;

}

.credit{

margin-top:20px;

text-align:center;

color:#9ecfff;

font-size:13px;

}

</style>

</head>

<body>

<div id="stars"></div>

<div id="love"></div>

<!-- ======================
PAGE 1
====================== -->

<div id="page1" class="page">

<div class="card">

<h2>🎁 Coba Gosok Kartunya</h2>

<p>Gosok perlahan sampai habis ❤️</p>

<div class="scratch">

<div id="happy">

<div class="flower fl1">🌸</div>
<div class="flower fl2">🌸</div>
<div class="flower fl3">🌸</div>
<div class="flower fl4">🌸</div>

<div class="big">

Happy

<br>

Girlfriend

<br>

Day! ❤️

</div>

<div class="small">

Untuk seseorang yang paling spesial 💕

</div>

</div>

<canvas id="canvas"></canvas>

</div>

<div class="info">

✨ Gosok sampai bersih ya ✨

</div>

</div>

</div>

<!-- ======================
PAGE 2
====================== -->

<div id="page2" class="page">

<div class="happyCard">

<div class="glow g1"></div>

<div class="glow g2"></div>

<div class="flower fl1">🌸</div>
<div class="flower fl2">🌸</div>
<div class="flower fl3">🌸</div>
<div class="flower fl4">🌸</div>

<h1>

<span>Happy</span>

Girlfriend

Day ❤️

</h1>

</div>

</div>

<!-- ======================
PAGE 3
====================== -->

<div id="page3" class="page">

<div class="letter">

<div class="profile">

<img src="poto.jpg">

<div>

<h3>Happy Girlfriend Day ❤️</h3>

<small>1 Agustus 2026</small>

</div>

</div>

<div id="typing"></div>

<button class="reply" id="reply">

💌 Balas

</button>

<div class="credit">

Made With ❤️ By Fahz Official

</div>

</div>

</div>

<script>
// =====================================
// STAR
// =====================================

const stars = document.getElementById("stars");

for(let i=0;i<150;i++){

const s=document.createElement("div");

s.className="star";

const size=Math.random()*3+1;

s.style.width=size+"px";
s.style.height=size+"px";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*3+"s";

stars.appendChild(s);

}

// =====================================
// LOVE
// =====================================

const love=document.getElementById("love");

setInterval(()=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤️","💕","💖","🌸","✨"][Math.floor(Math.random()*5)];

h.style.left=Math.random()*100+"%";

h.style.fontSize=(18+Math.random()*20)+"px";

h.style.animationDuration=(8+Math.random()*6)+"s";

love.appendChild(h);

setTimeout(()=>{

h.remove();

},15000);

},700);

// =====================================
// SCRATCH
// =====================================

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

function initScratch(){

canvas.width=canvas.offsetWidth;

canvas.height=canvas.offsetHeight;

ctx.globalCompositeOperation="source-over";

let grd=ctx.createLinearGradient(0,0,canvas.width,canvas.height);

grd.addColorStop(0,"#6db8ff");

grd.addColorStop(1,"#8cd0ff");

ctx.fillStyle=grd;

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(255,255,255,.18)";

for(let i=0;i<80;i++){

ctx.fillRect(

Math.random()*canvas.width,

Math.random()*canvas.height,

160,

2

);

}

ctx.fillStyle="white";

ctx.font="bold 32px Poppins";

ctx.textAlign="center";

ctx.fillText(

"GOSOK DISINI",

canvas.width/2,

canvas.height/2

);

ctx.globalCompositeOperation="destination-out";

}

initScratch();

window.addEventListener("resize",initScratch);

let drawing=false;

function erase(x,y){

ctx.beginPath();

ctx.arc(x,y,30,0,Math.PI*2);

ctx.fill();

}

canvas.addEventListener("mousedown",()=>{

drawing=true;

});

canvas.addEventListener("mouseup",()=>{

drawing=false;

checkScratch();

});

canvas.addEventListener("mouseleave",()=>{

drawing=false;

});

canvas.addEventListener("mousemove",(e)=>{

if(!drawing)return;

const rect=canvas.getBoundingClientRect();

erase(

e.clientX-rect.left,

e.clientY-rect.top

);

});

canvas.addEventListener("touchstart",(e)=>{

drawing=true;

const rect=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-rect.left,

t.clientY-rect.top

);

});

canvas.addEventListener("touchmove",(e)=>{

e.preventDefault();

if(!drawing)return;

const rect=canvas.getBoundingClientRect();

const t=e.touches[0];

erase(

t.clientX-rect.left,

t.clientY-rect.top

);

},{passive:false});

canvas.addEventListener("touchend",()=>{

drawing=false;

checkScratch();

});
// =====================================
// CEK PERSENTASE GOSOK
// =====================================

function checkScratch(){

const img=ctx.getImageData(0,0,canvas.width,canvas.height);

let clear=0;

for(let i=3;i<img.data.length;i+=4){

if(img.data[i]==0) clear++;

}

const percent=clear/(canvas.width*canvas.height);

if(percent>=0.70){

canvas.style.pointerEvents="none";

canvas.animate([
{opacity:1},
{opacity:0}
],{
duration:800,
fill:"forwards"
});

setTimeout(()=>{

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

document.querySelector(".happyCard").animate([
{
transform:"scale(.7)",
opacity:0
},
{
transform:"scale(1)",
opacity:1
}
],{
duration:700,
fill:"forwards"
});

},900);

setTimeout(()=>{

document.getElementById("page2").style.opacity="0";

setTimeout(()=>{

document.getElementById("page2").style.display="none";

document.getElementById("page3").style.display="flex";

document.getElementById("page3").style.opacity="1";

startTyping();

},700);

},3500);

}

}

// =====================================
// SURAT
// =====================================

const surat=`Happy Girlfriend Day sayangku ❤️

Hari ini aku cuma ingin mengingatkan satu hal...

Terima kasih sudah hadir di hidupku.

Terima kasih sudah menjadi seseorang yang selalu membuat hariku terasa lebih indah.

Aku mungkin belum sempurna.

Aku masih sering melakukan kesalahan.

Masih sering membuatmu kesal.

Masih sering membuatmu kecewa.

Tetapi percayalah...

Tidak pernah sedikit pun aku berniat menyakitimu.

Aku selalu berusaha menjadi seseorang yang lebih baik.

Karena aku ingin selalu membuatmu bangga.

Aku ingin selalu menemanimu dalam keadaan apa pun.

Aku ingin melihat senyummu setiap hari.

Semoga hubungan kita selalu dipenuhi kebahagiaan.

Semoga kita selalu diberi kesehatan.

Semoga kita selalu saling percaya.

Semoga kita selalu bersama.

Aku sayang kamu...

Hari ini...

Besok...

Dan seterusnya...

Happy Girlfriend Day ❤️

I Love You Forever 🤍

`;

let i=0;

const typing=document.getElementById("typing");

function startTyping(){

typing.innerHTML="";

const cursor=document.createElement("span");

cursor.className="cursor";

const timer=setInterval(()=>{

typing.innerHTML+=surat.charAt(i);

typing.appendChild(cursor);

i++;

document.querySelector(".letter").scrollTop=document.querySelector(".letter").scrollHeight;

if(i>=surat.length){

clearInterval(timer);

document.getElementById("reply").style.display="block";

}

},35);

}
// ======================================
// TOMBOL BALAS WHATSAPP
// ======================================

const reply = document.getElementById("reply");

reply.onclick = ()=>{

const nomor = "6281234567890"; // GANTI NOMOR WA

const pesan = encodeURIComponent(
"Hai Sayang ❤️\n\nHappy Girlfriend Day juga 🥹❤️"
);

window.open(
"https://wa.me/"+nomor+"?text="+pesan,
"_blank"
);

};

// ======================================
// MUSIK
// ======================================

const music = new Audio("musik.mp3");

music.loop = true;

document.body.addEventListener("click",()=>{

music.play().catch(()=>{});

},{once:true});

// ======================================
// EFEK KURSOR
// ======================================

setInterval(()=>{

const c=document.querySelector(".cursor");

if(c){

c.style.opacity=c.style.opacity=="0"?"1":"0";

}

},500);

// ======================================
// LOVE TAMBAHAN
// ======================================

setInterval(()=>{

const emoji=["❤️","💕","💖","💗","🌸","✨"];

const h=document.createElement("div");

h.className="heart";

h.innerHTML=emoji[Math.floor(Math.random()*emoji.length)];

h.style.left=Math.random()*100+"%";

h.style.fontSize=(20+Math.random()*25)+"px";

h.style.animationDuration=(10+Math.random()*6)+"s";

love.appendChild(h);

setTimeout(()=>{

h.remove();

},15000);

},1200);

// ======================================
// PENUTUP
// ======================================

console.log("Happy Girlfriend Day ❤️");
</script>

</body>

</html>
